{% extends 'students/base.html' %}

{% block title %}Главная{% endblock %}

{% block content %}
    <h1>Мой блог</h1>
    {% for post in posts %}
    <article>
        <h2><a href="{% url 'post_detail' post.pk %}">{{ post.title }}</a></h2>
        <p>{{ post.text|truncatewords:20 }}</p>
        <small>{{ post.created_at|date:"d.m.Y H:i" }}</small>
    </article>
    {% empty %}
        <p>Постов пока нет.</p>
{% endfor %}
{% endblock %}
